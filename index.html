<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEX CORE V.I.P | ANAND 😈</title>
    <style>
        :root {
            --primary: #00ff88; 
            --secondary: #8a2be2; 
            --bg: #03030b; 
            --accent: #ff6b00; 
        }

        * { box-sizing: border-box; cursor: crosshair; }
        
        body {
            background: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            overflow: hidden;
            padding: 20px;
        }

        #particle-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }

        @keyframes rainbowBorder {
            0% { border-color: #ff0000; box-shadow: 0 0 30px rgba(255, 0, 0, 0.6); }
            25% { border-color: #00ff00; box-shadow: 0 0 30px rgba(0, 255, 0, 0.6); }
            50% { border-color: #00f7ff; box-shadow: 0 0 30px rgba(0, 247, 255, 0.6); }
            75% { border-color: #8a2be2; box-shadow: 0 0 30px rgba(138, 43, 226, 0.6); }
            100% { border-color: #ff0000; box-shadow: 0 0 30px rgba(255, 0, 0, 0.6); }
        }

        .main-card {
            width: 95%;
            max-width: 480px;
            background: rgba(10, 10, 25, 0.92);
            border: 4px solid var(--primary);
            border-radius: 25px;
            padding: 30px;
            text-align: center;
            position: relative;
            animation: rainbowBorder 4s linear infinite;
            backdrop-filter: blur(15px);
            z-index: 10;
        }

        .logo-section {
            width: 90px; height: 90px;
            margin: -75px auto 15px;
            background: #000;
            border: 3px solid #fff;
            border-radius: 50%;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            animation: rainbowBorder 4s linear infinite;
        }
        .logo-section img { width: 100%; height: 100%; object-fit: cover; }

        .owner-badge {
            background: linear-gradient(90deg, #ff0000, #00ff00, #00f7ff, #ff00ff);
            background-size: 300%;
            padding: 8px 25px;
            border-radius: 50px;
            display: inline-block;
            font-size: 14px;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 10px;
            animation: moveGradient 2s linear infinite;
            color: #fff;
        }

        @keyframes moveGradient { 0% { background-position: 0%; } 100% { background-position: 300%; } }

        .user-info {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px 10px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 11px;
            text-transform: uppercase;
            font-weight: bold;
        }
        .info-box span { display: block; color: var(--primary); font-size: 13px; margin-top: 4px; }

        .terminal {
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(0, 255, 136, 0.2);
            height: 130px;
            margin-bottom: 20px;
            padding: 12px;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            text-align: left;
            overflow: hidden;
            color: #00ff88;
            border-radius: 12px;
        }

        .btn-main {
            width: 100%; padding: 18px;
            background: linear-gradient(45deg, #00ff88, #0088cc);
            color: #fff; border: none; border-radius: 15px;
            font-weight: 900; text-transform: uppercase;
            cursor: pointer; transition: 0.3s; font-size: 16px;
            box-shadow: 0 5px 15px rgba(0,255,136,0.3);
        }
        .btn-main:hover { transform: scale(1.02); box-shadow: 0 0 30px var(--primary); }

        .result-box {
            display: none; background: rgba(0,0,0,0.5);
            padding: 20px; border-radius: 20px;
            border: 2px dashed var(--primary); margin-top: 20px;
        }

        .key-text {
            font-size: 1.6rem; color: #fff;
            display: block; margin: 15px 0; padding: 15px;
            background: rgba(255,255,255,0.05); border-radius: 10px;
            text-shadow: 0 0 10px var(--primary); border: 1px solid var(--primary);
        }

        .social-grid { display: flex; gap: 10px; margin-top: 20px; }
        .social-btn { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #fff; background: transparent; color: #fff; font-size: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>

    <div class="main-card">
        <div class="logo-section">
            <img src="https://via.placeholder.com/100" alt="LOGO">
        </div>

        <div class="owner-badge">OWNER: ANAND 😈</div>
        <h2 style="margin:5px 0; letter-spacing: 1px;">HEX CORE VIP</h2>

        <div class="user-info">
            <div class="info-box">LIVE<span id="onlineCount">1,000+</span></div>
            <div class="info-box">USER<span>10 MILLION+</span></div>
            <div class="info-box">PING<span id="pingVal">-- ms</span></div>
        </div>

        <div class="terminal" id="term">
            <div id="term-content">
                [+] System Initialized...<br>
                [+] Ready to Generate...
            </div>
        </div>

        <div id="action-area">
            <button class="btn-main" onclick="startFlow()">GENERATE ACCESS KEY</button>
        </div>

        <div id="procBar" style="display:none; margin:20px 0;">
            <div style="color:var(--accent); font-weight:bold; font-size: 14px;">VERIFYING REQUEST: <span id="timer">30</span>s</div>
            <div style="width:100%; height:10px; background:#111; border-radius:10px; margin-top:10px; overflow:hidden;">
                <div id="pBar" style="width:0%; height:100%; background:linear-gradient(90deg, #ff00ff, #00ff88); transition:1s linear;"></div>
            </div>
        </div>

        <div id="result-area" class="result-box">
            <span style="font-size:12px; color:#aaa;">VIP KEY UNLOCKED:</span>
            <span class="key-text" id="keyOutput">...</span>
            <button class="btn-main" onclick="copyKey()">COPY KEY</button>
        </div>

        <div class="social-grid">
            <button class="social-btn" style="border-color:#0088cc;" onclick="window.open('https://t.me/+4N0Gp0aCxIs3MjZl')">TELEGRAM</button>
            <button class="social-btn" style="border-color:#ff0000;" onclick="window.open('https://youtube.com/@akbhexcoreofc1')">YOUTUBE</button>
        </div>
    </div>

    <script>
        const myShortLink = "https://earnlinks.in/A8Zqu";
        const keys = ["HEX-VIP-9922", "CORE-X07", "GOLD-881", "ANAND-VIP-2026"];

        // --- GITHUB PAGES LOGIC ---
        window.onload = () => {
            // Agar link ke aakhir mein #verify-complete hai, toh direct KEY dikhao
            if(window.location.hash === "#verify-complete") {
                document.getElementById('action-area').style.display = 'none';
                document.getElementById('result-area').style.display = 'block';
                document.getElementById('keyOutput').innerText = keys[Math.floor(Math.random()*keys.length)];
                addLog("[SUCCESS] Bypass Complete!");
            }
        };

        function addLog(msg) {
            const container = document.getElementById('term-content');
            const line = document.createElement('div');
            line.innerHTML = `> ${msg}`;
            container.appendChild(line);
            if (container.childElementCount > 10) container.removeChild(container.firstChild);
            document.getElementById('term').scrollTop = document.getElementById('term').scrollHeight;
        }

        function startFlow() {
            document.getElementById('action-area').style.display = 'none';
            document.getElementById('procBar').style.display = 'block';
            const hackMsgs = ["Bypassing...", "Connecting...", "Generating Token...", "Redirecting to Ads..."];
            const fastTerm = setInterval(() => addLog(hackMsgs[Math.floor(Math.random() * hackMsgs.length)]), 100);
            
            let time = 10; // 10 second wait before link redirect
            const timer = setInterval(() => {
                time--;
                document.getElementById('timer').innerText = time;
                document.getElementById('pBar').style.width = ((10-time)/10 * 100) + "%";
                if(time <= 0) {
                    clearInterval(timer);
                    clearInterval(fastTerm);
                    window.location.href = myShortLink;
                }
            }, 1000);
        }

        function copyKey() {
            navigator.clipboard.writeText(document.getElementById('keyOutput').innerText);
            alert("KEY COPIED!");
        }

        // --- PARTICLES ---
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let pts = [];
        let mouse = { x: -1000, y: -1000 };
        window.onmousemove = (e) => { mouse.x = e.x; mouse.y = e.y; };
        window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
        window.onresize();
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.s = Math.random() * 2 + 1;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.hue = Math.random() * 360;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                this.hue += 1;
                let dx = mouse.x - this.x; let dy = mouse.y - this.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                if(dist < 100) { this.x -= dx * 0.05; this.y -= dy * 0.05; }
                if(this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if(this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.s, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue}, 100%, 50%, 0.8)`;
                ctx.fill();
            }
        }
        for(let i=0; i<80; i++) pts.push(new Particle());
        function animate() {
            ctx.fillStyle = "rgba(3, 3, 11, 0.2)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            pts.forEach((p, i) => {
                p.update(); p.draw();
                for(let j=i+1; j<pts.length; j++) {
                    let dx = p.x - pts[j].x; let dy = p.y - pts[j].y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    if(dist < 100) {
                        ctx.beginPath();
                        ctx.strokeStyle = `hsla(${p.hue}, 100%, 50%, ${1 - dist/100})`;
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(p.x, p.y); ctx.lineTo(pts[j].x, pts[j].y);
                        ctx.stroke();
                    }
                }
            });
            requestAnimationFrame(animate);
        }
        animate();
        setInterval(() => { 
            document.getElementById('onlineCount').innerText = (1000 + Math.floor(Math.random()*500)).toLocaleString() + "+";
            document.getElementById('pingVal').innerText = 15 + Math.floor(Math.random()*30) + " ms";
        }, 2000);
    </script>
</body>
</html>
