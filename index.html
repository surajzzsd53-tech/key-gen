<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEX CORE V.I.P | ANAND 😈</title>
    <link rel="preconnect" href="https://i.ibb.co"> 
    
    <style>
        :root {
            --primary: #00ff88; 
            --secondary: #8a2be2; 
            --bg: #03030b; 
            --accent: #ff6b00; 
        }

        * { box-sizing: border-box; cursor: crosshair; }
        
        body {
            background: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            overflow: hidden;
            padding: 20px;
        }

        #particle-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }

        @keyframes rainbowBorder {
            0% { border-color: #ff0000; box-shadow: 0 0 30px rgba(255, 0, 0, 0.6); }
            25% { border-color: #00ff00; box-shadow: 0 0 30px rgba(0, 255, 0, 0.6); }
            50% { border-color: #00f7ff; box-shadow: 0 0 30px rgba(0, 247, 255, 0.6); }
            75% { border-color: #8a2be2; box-shadow: 0 0 30px rgba(138, 43, 226, 0.6); }
            100% { border-color: #ff0000; box-shadow: 0 0 30px rgba(255, 0, 0, 0.6); }
        }

        .main-card {
            width: 95%;
            max-width: 480px;
            background: rgba(10, 10, 25, 0.92);
            border: 4px solid var(--primary);
            border-radius: 25px;
            padding: 30px;
            text-align: center;
            position: relative;
            animation: rainbowBorder 4s linear infinite;
            backdrop-filter: blur(15px);
            z-index: 10;
        }

        /* LOGO SECTION - Instant Load Fix */
        .logo-section {
            width: 90px; height: 90px;
            margin: -75px auto 15px;
            background: #000;
            border: 3px solid #fff;
            border-radius: 50%;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            animation: rainbowBorder 4s linear infinite;
            position: relative;
        }
        
        .logo-section img { 
            width: 100%; height: 100%; 
            object-fit: cover; 
            z-index: 2;
            /* Yahan opacity 1 rakhi hai taaki delay na ho */
            opacity: 1; 
        }

        .owner-badge {
            background: linear-gradient(90deg, #ff0000, #00ff00, #00f7ff, #ff00ff);
            background-size: 300%;
            padding: 8px 25px;
            border-radius: 50px;
            display: inline-block;
            font-size: 14px;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 10px;
            animation: moveGradient 2s linear infinite;
            color: #fff;
        }

        @keyframes moveGradient { 0% { background-position: 0%; } 100% { background-position: 300%; } }

        .user-info {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px 10px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 11px;
            text-transform: uppercase;
            font-weight: bold;
        }
        .info-box span { display: block; color: var(--primary); font-size: 13px; margin-top: 4px; }

        .terminal {
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(0, 255, 136, 0.2);
            height: 110px;
            margin-bottom: 20px;
            padding: 12px;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            text-align: left;
            overflow: hidden;
            color: #00ff88;
            border-radius: 12px;
        }

        .btn-main {
            width: 100%; padding: 18px;
            background: linear-gradient(45deg, #00ff88, #0088cc);
            color: #fff; border: none; border-radius: 15px;
            font-weight: 900; text-transform: uppercase;
            cursor: pointer; transition: 0.3s; font-size: 16px;
            box-shadow: 0 5px 15px rgba(0,255,136,0.3);
        }

        .result-box {
            display: none; background: rgba(0,0,0,0.5);
            padding: 20px; border-radius: 20px;
            border: 2px dashed var(--primary); margin-top: 10px;
        }

        .key-text {
            font-size: 1.4rem; color: #fff;
            display: block; margin: 15px 0; padding: 15px;
            background: rgba(255,255,255,0.05); border-radius: 10px;
            text-shadow: 0 0 10px var(--primary); border: 1px solid var(--primary);
            word-break: break-all;
            letter-spacing: 1px;
        }

        .social-grid { display: flex; gap: 10px; margin-top: 20px; }
        .social-btn { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #fff; background: transparent; color: #fff; font-size: 10px; cursor: pointer; }
        
        @media (max-width: 480px) {
            .main-card { padding: 20px; width: 90%; }
            .logo-section { width: 75px; height: 75px; margin-top: -60px; }
            .key-text { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>

    <div class="main-card">
        <div class="logo-section">
            <img src="https://i.ibb.co/cKfdyBRj/IMG-20260108-002002-409.jpg" alt="LOGO" fetchpriority="high" loading="eager">
        </div>

        <div id="ui-top">
            <div class="owner-badge">OWNER: ANAND 😈</div>
            <h2 style="margin:5px 0; letter-spacing: 1px;">HEX CORE VIP</h2>
        </div>

        <div class="user-info" id="stats-box">
            <div class="info-box">LIVE<span id="onlineCount">1,248+</span></div>
            <div class="info-box">USER<span>10M+</span></div>
            <div class="info-box">PING<span id="pingVal">24 ms</span></div>
        </div>

        <div class="terminal" id="term">
            <div id="term-content">> [INFO] System Online...<br>> [READY] Waiting for user...</div>
        </div>

        <div id="action-area">
            <button class="btn-main" onclick="startFlow()">GENERATE ACCESS KEY</button>
        </div>

        <div id="procBar" style="display:none; margin:20px 0;">
            <div style="color:var(--accent); font-weight:bold; font-size: 14px;">REDIRECTING... <span id="timer">10</span>s</div>
            <div style="width:100%; height:10px; background:#111; border-radius:10px; margin-top:10px; overflow:hidden;">
                <div id="pBar" style="width:0%; height:100%; background:linear-gradient(90deg, #ff00ff, #00ff88); transition:1s linear;"></div>
            </div>
        </div>

        <div id="result-area" class="result-box">
            <span style="font-size:12px; color:var(--primary); font-weight: bold;">VERIFICATION SUCCESSFUL!</span>
            <span class="key-text" id="keyOutput">HEX_CORE_KEYS_101</span>
            <button class="btn-main" onclick="copyKey()">COPY VIP KEY</button>
        </div>

        <div class="social-grid">
            <button class="social-btn" style="border-color:#0088cc;" onclick="window.open('https://t.me/+4N0Gp0aCxIs3MjZl')">TELEGRAM</button>
            <button class="social-btn" style="border-color:#ff0000;" onclick="window.open('https://youtube.com/@akbhexcoreofc1')">YOUTUBE</button>
        </div>
    </div>

    <script>
        const myShortLink = "https://earnlinks.in/A8Zqu";
        const fixKey = "HEX_CORE_KEYS_101";

        window.onload = () => {
            // Hash check for completion
            if(window.location.hash === "#verify-complete") {
                document.getElementById('action-area').style.display = 'none';
                document.getElementById('term').style.display = 'none';
                document.getElementById('stats-box').style.display = 'none';
                document.getElementById('ui-top').style.display = 'none';
                
                // Show result and set fix key
                document.getElementById('result-area').style.display = 'block';
                document.getElementById('keyOutput').innerText = fixKey;
            }
        };

        function startFlow() {
            document.getElementById('action-area').style.display = 'none';
            document.getElementById('procBar').style.display = 'block';
            let time = 10;
            const timer = setInterval(() => {
                time--;
                document.getElementById('timer').innerText = time;
                document.getElementById('pBar').style.width = ((10-time)/10 * 100) + "%";
                if(time <= 0) {
                    clearInterval(timer);
                    window.location.href = myShortLink;
                }
            }, 1000);
        }

        function copyKey() {
            const key = document.getElementById('keyOutput').innerText;
            navigator.clipboard.writeText(key).then(() => {
                alert("VIP KEY COPIED: " + key);
            });
        }

        // Optimized Particles for Mobile
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let pts = [];
        window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
        window.onresize();
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.s = Math.random() * 1.5;
                this.vx = (Math.random() - 0.5) * 1.2;
                this.vy = (Math.random() - 0.5) * 1.2;
                this.hue = Math.random() * 360;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                if(this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if(this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.s, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue}, 100%, 50%, 0.4)`;
                ctx.fill();
            }
        }
        for(let i=0; i<40; i++) pts.push(new Particle());
        function animate() {
            ctx.fillStyle = "rgba(3, 3, 11, 0.3)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            pts.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
